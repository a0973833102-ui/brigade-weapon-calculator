<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百變兵團武器強化需求計算器</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;padding:24px;background:#050607;color:#f3f4f6;font:15px "Microsoft JhengHei",Arial,sans-serif}
main{max-width:760px;margin:0 auto}
.panel{background:#101113;border:1px solid #292b30;border-radius:16px;padding:22px;box-shadow:0 18px 50px #0009}
h1{font-size:23px;text-align:center;margin:0 0 6px}
.sub{text-align:center;color:#9298a3;font-size:12px;margin:0 0 22px}
label{display:block;font-size:13px;color:#b8bec8;margin:14px 0 7px}
select,input[type=number]{width:100%;padding:12px;border:1px solid #383c44;border-radius:9px;background:#090a0c;color:#fff;font:inherit;outline:none}
select:focus,input:focus{border-color:#6b9ee8;box-shadow:0 0 0 2px #6b9ee822}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:#090a0c;border:1px solid #383c44;border-radius:9px;margin-top:8px}
.toggle span{font-size:14px}.toggle input{width:19px;height:19px;accent-color:#77aaff}
button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:linear-gradient(90deg,#245da8,#397ed2);color:white;font-size:16px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.12)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.result{padding:16px;border:1px solid #30343c;border-radius:11px;background:#090a0c;min-width:0}
.result h2{font-size:16px;margin:0 0 12px}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #24272d}
.item:last-child{border:0}.item span{color:#aeb5c0}.item strong{font-size:16px;text-align:right}
.error{color:#ff9292;font-size:13px;margin-top:12px}
.hint{font-size:12px;line-height:1.7;color:#858d99;margin:14px 0 0}
.note{color:#d6b66d}
@media(max-width:560px){body{padding:12px}.panel{padding:16px}.grid,.results{grid-template-columns:1fr;gap:4px}h1{font-size:20px}}
</style>
</head>
<body>
<main><section class="panel">
<h1>百變兵團武器強化計算器</h1>
<p class="sub">深黑色版本・可手動輸入等級・同時計算同名與非同名武器</p>

<label for="type">武器類型</label>
<select id="type"><option value="blue">藍武</option><option value="purple">紫武</option></select>

<div class="grid">
  <div><label for="currentLevel">目前等級（0～19）</label><input id="currentLevel" type="number" min="0" max="19" step="1" value="0"></div>
  <div><label for="targetLevel">目標等級（1～20）</label><input id="targetLevel" type="number" min="1" max="20" step="1" value="1"></div>
</div>

<label for="insideExp">目前等級內已累積經驗</label>
<input id="insideExp" type="number" min="0" step="1" value="0" placeholder="輸入目前等級內的經驗">

<label>是否使用增幅劑</label>
<div class="toggle"><span>使用增幅劑（材料經驗加倍）</span><input id="boost" type="checkbox" checked></div>

<button id="calculateBtn" type="button">計算所需材料</button>
<div id="error" class="error" role="alert"></div>

<div class="results" id="results" hidden>
  <section class="result">
    <h2>非同名武器材料</h2>
    <div class="item"><span>非同名武器</span><strong id="normalWeapon">0 把</strong></div>
    <div class="item"><span>增幅劑</span><strong id="normalBoost">0 個</strong></div>
    <div class="item"><span>鈦合金</span><strong id="normalTitanium">0 個</strong></div>
    <div class="item"><span>奈米原素</span><strong id="normalNano">0 個</strong></div>
  </section>
  <section class="result">
    <h2>同名武器材料</h2>
    <div class="item"><span>同名武器</span><strong id="sameWeapon">0 把</strong></div>
    <div class="item"><span>增幅劑</span><strong id="sameBoost">0 個</strong></div>
    <div class="item"><span>鈦合金</span><strong id="sameTitanium">0 個</strong></div>
    <div class="item"><span>奈米原素</span><strong id="sameNano">0 個</strong></div>
  </section>
</div>
<p class="hint">非同名武器經驗：藍武 1,250／把、紫武 6,000／把。<br>
同名武器經驗：藍武 1,875／把、紫武 9,000／把；紫武 9,000 為待確認的推算值。<br>
材料配方：藍武每把 3 鈦合金、3 奈米原素、2 增幅劑；紫武每把 10 鈦合金、10 奈米原素、5 增幅劑。未勾選增幅劑時，不計算增幅劑及其搭配材料。</p>
</section></main>
<script>
const xp={
 blue:[0,1000,2500,4500,7000,10000,15000,22500,32500,45000,59500,85500,123000,171500,231500,302500,427500,606500,839500,1126000,1466500],
 purple:[0,2000,5000,9000,14000,20000,32000,50000,74000,105000,142000,219000,336000,492000,688000,924000,1411000,2149000,3139000,4380000,5872000]
};
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-US');
function calculate(){
 const type=$('type').value;
 const curLv=Number($('currentLevel').value),target=Number($('targetLevel').value);
 const inside=Number($('insideExp').value),boost=$('boost').checked;
 $('error').textContent='';$('results').hidden=true;
 if(!Number.isInteger(curLv)||curLv<0||curLv>19){$('error').textContent='目前等級請輸入 0～19 的整數。';return}
 if(!Number.isInteger(target)||target<1||target>20){$('error').textContent='目標等級請輸入 1～20 的整數。';return}
 if(target<=curLv){$('error').textContent='目標等級必須高於目前等級。';return}
 if(!Number.isFinite(inside)||inside<0||!Number.isInteger(inside)){$('error').textContent='目前等級內已累積經驗請輸入 0 或以上的整數。';return}
 const table=xp[type],levelNeed=table[curLv+1]-table[curLv];
 if(inside>=levelNeed){$('error').textContent='目前等級內已累積經驗不可大於或等於該級升級所需經驗，請檢查輸入。';return}
 const needed=table[target]-(table[curLv]+inside);
 const normalBase=type==='blue'?1250:6000;
 const sameBase=type==='blue'?1875:9000;
 const perBoost=boost?2:1;
 const normalCount=Math.ceil(needed/(normalBase*perBoost));
 const sameCount=Math.ceil(needed/(sameBase*perBoost));
 const boostEach=type==='blue'?2:5;
 const titaniumEach=type==='blue'?3:10;
 const nanoEach=type==='blue'?3:10;
 const put=(id,value,unit)=>$(id).textContent=fmt(value)+' '+unit;
 put('normalWeapon',normalCount,'把');
 put('normalBoost',boost?normalCount*boostEach:0,'個');
 put('normalTitanium',boost?normalCount*titaniumEach:0,'個');
 put('normalNano',boost?normalCount*nanoEach:0,'個');
 put('sameWeapon',sameCount,'把');
 put('sameBoost',boost?sameCount*boostEach:0,'個');
 put('sameTitanium',boost?sameCount*titaniumEach:0,'個');
 put('sameNano',boost?sameCount*nanoEach:0,'個');
 $('results').hidden=false;
}
$('calculateBtn').addEventListener('click',calculate);
['type','currentLevel','targetLevel','insideExp','boost'].forEach(id=>$(id).addEventListener('change',()=>{$('results').hidden=true;$('error').textContent=''}));
</script>
</body></html>
