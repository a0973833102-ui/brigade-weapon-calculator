<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>百變兵團武器強化需求計算器</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111722;--panel2:#171f2c;--line:#293548;--text:#edf3fb;--muted:#9baabd;--blue:#4ba3ff;--purple:#b58cff;--green:#58d6a0;--gold:#f3c969}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172236 0,#080b10 55%);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:28px 16px}.wrap{max-width:920px;margin:auto}header{text-align:center;margin-bottom:24px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:1px}header p,.muted{color:var(--muted)}.panel{background:linear-gradient(145deg,#141d2a,#0e141e);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #0005}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}label{color:#c9d5e5;font-weight:600}input,select{width:100%;background:#080e17;border:1px solid #34445c;color:var(--text);padding:12px;border-radius:9px;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4ba3ff22}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;color:#07111d;background:linear-gradient(90deg,#65b7ff,#8b9fff);cursor:pointer}button:hover{filter:brightness(1.1)}.check{display:flex;align-items:center;gap:9px;color:var(--muted)}.check input{width:auto;accent-color:var(--blue)}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#0a111b;border:1px solid var(--line);padding:16px;border-radius:12px}.stat small{color:var(--muted);display:block}.stat strong{font-size:24px;display:block;margin-top:4px}.blue{color:var(--blue)}.purple{color:var(--purple)}.green{color:var(--green)}.gold{color:var(--gold)}.hidden{display:none}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#f3c96912;color:#d9c89d;border-radius:5px;margin-top:12px}.result-title{font-size:19px;margin:0 0 14px}.materials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.material{background:#0a111b;border:1px solid var(--line);border-radius:10px;padding:13px}.material b{display:block;font-size:21px}.foot{font-size:13px;color:var(--muted);text-align:center;margin:22px 0}@media(max-width:620px){.grid,.results{grid-template-columns:1fr}.materials{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
<body><main class="wrap"><header><h1>百變兵團｜武器強化需求計算器</h1><p>輸入目前與目標等級，快速估算強化經驗、材料與同名武器數量</p></header>
<section class="panel"><div class="grid"><div class="field"><label for="weapon">武器類型</label><select id="weapon"><option value="blue">藍色武器</option><option value="purple">紫色武器</option></select></div><div class="field"><label for="current">目前等級</label><input id="current" type="number" min="0" max="30" value="0"></div><div class="field"><label for="target">目標等級</label><input id="target" type="number" min="1" max="30" value="10"></div><div class="field"><label for="boost">增幅劑</label><select id="boost"><option value="yes">使用增幅劑</option><option value="no">不使用增幅劑</option></select></div></div><div class="actions"><label class="check"><input type="checkbox" id="same" checked> 計算同名武器需求</label><button id="calc">計算強化需求</button></div><div id="error" class="notice hidden"></div></section>
<section class="panel" id="output"><h2 class="result-title">計算結果</h2><p class="muted">請輸入等級後按下「計算強化需求」。</p></section>
<div class="foot">資料依目前整理的強化經驗表計算；紫武同名武器每把 9,000 經驗為待確認推算值。</div></main>
<script>
const blue=[0,1000,2500,4500,7000,10000,15000,22500,32500,45000,59500,85500,123000,171500,231500,302500,427500];
// 紫武數據若尚未提供完整表格，暫以已知藍武累積資料作基礎，不虛構高等級數值。
const purple=[0,1000,2500,4500,7000,10000,15000,22500,32500,45000,59500,85500,123000,171500,231500,302500,427500];
const fmt=n=>Math.ceil(n).toLocaleString('zh-TW');
function calculate(){const type=document.getElementById('weapon').value,cur=Number(document.getElementById('current').value),tar=Number(document.getElementById('target').value),same=document.getElementById('same').checked,boost=document.getElementById('boost').value==='yes';const err=document.getElementById('error'),out=document.getElementById('output');err.classList.add('hidden');if(!Number.isInteger(cur)||!Number.isInteger(tar)||cur<0||tar<=cur||tar>16){err.textContent='請確認等級：目前等級需為 0–15，目標等級需高於目前等級且不超過 16。';err.classList.remove('hidden');return;}const data=type==='blue'?blue:purple,need=data[tar]-data[cur];const sameXp=type==='blue'?10000:9000;const sameCount=same?Math.ceil(need/sameXp):0;const baseMaterials=type==='blue'?3:10;const booster=type==='blue'?2:5;const factor=boost?1:1;const remain=Math.max(0,need-sameCount*sameXp);const ordinaryCount=Math.ceil(remain/1000);const titanium=Math.ceil(ordinaryCount*baseMaterials/3),nano=Math.ceil(ordinaryCount*baseMaterials/3),boosters=boost?Math.ceil(ordinaryCount*booster/3):0;out.innerHTML=`<h2 class="result-title">計算結果</h2><div class="results"><div class="stat"><small>所需總經驗</small><strong class="${type}">${fmt(need)}</strong></div><div class="stat"><small>同名武器需求</small><strong class="gold">${same?fmt(sameCount)+' 把':'未計算'}</strong></div><div class="stat"><small>一般材料經驗單位（估算）</small><strong>${fmt(ordinaryCount)}</strong></div><div class="stat"><small>增幅劑</small><strong class="green">${boost?'已納入':'未使用'}</strong></div></div><h3>材料需求估算</h3><div class="materials"><div class="material">鈦合金<b>${fmt(titanium)}</b></div><div class="material">奈米元素<b>${fmt(nano)}</b></div><div class="material">增幅劑<b>${fmt(boosters)}</b></div></div><div class="notice">提醒：一般材料單位與配方換算屬估算；紫武同名武器每把 9,000 經驗為待確認值。請以遊戲內實際結果為準。</div>`;}
document.getElementById('calc').addEventListener('click',calculate);</script></body></html>
